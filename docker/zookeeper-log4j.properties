# ZooKeeper log configuration to reduce noise
log4j.rootLogger=WARN, stdout

# Console appender
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{ISO8601} %p %c{1}: %m%n

# Suppress the noisy NIOServerCnxn messages
log4j.logger.org.apache.zookeeper.server.NIOServerCnxn=ERROR

# Keep important ZooKeeper logs at WARN level
log4j.logger.org.apache.zookeeper=WARN

# Kafka specific loggers
log4j.logger.org.apache.kafka=WARN
log4j.logger.kafka=WARN