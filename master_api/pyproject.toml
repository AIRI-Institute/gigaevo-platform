[project]
name = "master-api-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
    "aioredis>=2.0.0",
    "minio==7.2.18",
    "aiokafka>=0.8.0",
    "kafka-python>=2.0.2",
    "pandas>=2.0.0",
    "pydantic-settings>=2.11.0",
    "pytest",
    "pytest-asyncio",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.20",
    "aiohttp>=3.13.2",
    "aiosqlite>=0.21.0",
    "loguru>=0.7.3",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
