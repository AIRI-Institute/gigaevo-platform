specs:
  fitness:
    description: Main objective, ${metric_name}. Higher is better
    decimals: 3
    is_primary: true
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: !!float 1e-3
    sentinel_value: -1000
  val_fitness:
    description: Main objective (${metric_name}) on validation dataset. Higher is better
    decimals: 3
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: false
    significant_change: !!float 1e-3
    sentinel_value: -1000
  avg_extraction_failures:
    description: Average number of programs per run where answer extraction failed
    decimals: 3
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: !!float 1e-2
    sentinel_value: -1000
  avg_cost_utilization:
    description: Average cost ratio per LLM call (used / max cost)
    decimals: 3
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: 1000
  avg_prompt_cost_utilization:
    description: Average prompt cost ratio per LLM call (used / max cost)
    decimals: 3
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: 1000
  avg_response_cost_utilization:
    description: Average response cost ratio per LLM call (used / max cost)
    decimals: 3
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: 1000
  is_valid:
    description: Whether the program is valid (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0
