[project]
name = "geml-v0"
version = "0.1.0"
description = "MetaEvolveML V0 - Machine Learning Experiment Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.2",
    "pydantic-settings>=2.11.0",
]

# Optional dependencies for different components
[project.optional-dependencies]
master = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
    "aioredis>=2.0.0",
    "minio>=7.2.0",
    "aiokafka>=0.8.0",
    "kafka-python>=2.0.2",
]
runner = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "aioredis>=2.0.0",
    "celery>=5.3.0",
    "minio>=7.2.0",
    "anthropic>=0.7.0",
    "asyncio-mqtt>=0.16.0",
    "joblib>=1.3.0",
    "loguru>=0.7.0",
    "networkx",
    "scipy",
    "pandas",
    "cloudpickle",
    "matplotlib",
    "seaborn",
    "tensorboardX",
    "orjson",
    "diffpatch", 
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain>=0.3.0",  
]
web = [
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
]
all = [
    "geml-v0[master,runner,web]",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
lint.select = ["I", "E", "F", "W"]
lint.ignore = ["E501"]  # Line too long
exclude = [
  ".claude",
  ".ruff_cache",
  ".venv",
  ".vscode",
  "master_api/src/folder_constructor/validate_templates/*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = ["web_ui", "runner_api"]
